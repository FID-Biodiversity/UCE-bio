# version: '3.8'
# For the variables, create an '.env' file on the same level as this compose file
# In there, declare the variables with your desired values like:
# UCE_CONFIG_PATH=./../uceConfig.json
# JVM_ARGS=-Xmx8g
# ...

services:

  uce-fuseki-sparql:
    container_name: uce-fuseki-sparql
    image: docker.texttechnologylab.org/uce/uce-fuseki-sparql:0.0.1
    ports:
      - "16803:5430"
    volumes:
      - ${TDB2_DATA}:/fuseki/databases/${TDB2_ENDPOINT}
    environment:
      - JAVA_OPTIONS=${JAVA_OPTIONS}
    command: --update --tdb2 --port 5430 --loc /fuseki/databases/${TDB2_ENDPOINT} /${TDB2_ENDPOINT}
    networks:
      - app_net
    
  uce-rag-service:
    container_name: uce-rag-service
    build:
      context: .
      dockerfile: ./rag/Dockerfile
    ports:
      - "16800:5678" 
    depends_on:
      - uce-postgresql-db 
    networks:
      - app_net

  uce-web:
    container_name: uce-web
    build:
      context: .
      dockerfile: ./uce.portal/uce.web/Dockerfile
    ports:
      - "16808:4567"
    depends_on:
      uce-postgresql-db:
        condition: service_healthy
    networks:
      - app_net
    volumes:
      - "${UCE_CONFIG_PATH}:/app/config/uceConfig.json"
      - "./database:/app/database"
    command: ["java","--add-opens=java.base/java.util=ALL-UNNAMED","--add-opens=java.util/java.base=ALL-UNNAMED","-jar", "./target/webportal-jar-with-dependencies.jar", "-cf","/app/config/uceConfig.json"]

  uce-importer:
    container_name: uce-importer
    build:
      context: .
      dockerfile: ./uce.portal/uce.corpus-importer/Dockerfile
    depends_on:
      uce-postgresql-db:
        condition: service_healthy
    networks:
      - app_net
    volumes:
      - "./database:/app/database"
      # MOUNT HERE ALL UIMA CORPORA INTO THE '/app/input/corpora/zobodat' PATH 
      - "../test_data/corpora/test_data/biofid-mini/:/app/input/corpora/biofid-mini"
      #- "../test_data/corpora/test_data/biofid-mini/:/app/input/corpora/biofid-mini"
      #- "../test_data/corpora/test_data/zobodat:/app/input/corpora/zobodat"
    #command: [ "/bin/sh", "-c", "sleep 7 && java -jar ./target/importer.jar -srcDir /app/input/corpora/ -num 1 -t ${IMPORTER_THREADS}" ]
    command: ["java","-jar","./target/importer.jar","-srcDir", "/app/input/corpora/","-num", "1","-t", "${IMPORTER_THREADS}"
    ]
  uce-postgresql-db:
    container_name: uce-postgresql-db
    image: docker.texttechnologylab.org/uce/uce-postgresql:0.0.1
    environment:
      POSTGRES_DB: uce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234 
    ports:
      - "16802:5432"
    volumes:
      #- ./../backups/2025-07-03_BIOfid_Nova-Data/db-data:/var/lib/postgresql/data
      - ${POSTGRESQL_CONFIG}:/etc/postgresql.conf
      - pg-uce-data:/var/lib/postgresql/data
      
    command: -c config_file=/etc/postgresql.conf
    networks:
      - app_net
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        start_interval: 1s
        start_period: 30s
        retries: 20

networks:
  app_net:
    driver: bridge

volumes:
  #pgdata:
  pg-uce-data:
    external: true
  minio-data:
